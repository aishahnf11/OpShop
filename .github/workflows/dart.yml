# separate terms of service, privacy policy, and support
# documentation.

name: Flutter iOS CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: pod repo update
        working-directory: ios
      # Build without code signing for CI verification
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qq -r -9 Flutter_iOS_Build.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-build
          path: Flutter_iOS_Build.ipa
